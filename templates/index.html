
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InternScraper</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ request.scope.get('root_path', '') }}/">InternScraper</a>
            <span class="navbar-text text-light">Internship Search Dashboard</span>
        </div>
    </nav>

    <main class="container py-4">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Search Internships</h5>

                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label for="user" class="form-label">Username</label>
                        <input id="user" class="form-control" placeholder="Enter username">
                    </div>

                    <div class="col-md-3">
                        <label for="keyword" class="form-label">Keyword</label>
                        <input id="keyword" class="form-control" placeholder="Software, embedded...">
                    </div>

                    <div class="col-md-3">
                        <label for="company" class="form-label">Company</label>
                        <input id="company" class="form-control" placeholder="Company name">
                    </div>

                    <div class="col-md-3">
                        <label for="location" class="form-label">Location</label>
                        <input id="location" class="form-control" placeholder="City or state">
                    </div>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button id="search" class="btn btn-primary">Search</button>
                    <button id="refresh" class="btn btn-outline-primary">Fetch New Postings</button>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mb-3 flex-wrap">
            <button class="btn btn-dark active" data-view="results">Search Results</button>
            <button class="btn btn-outline-dark" data-view="saved">Saved Internships</button>
            <button class="btn btn-outline-dark" data-view="hidden">Not Interested</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 id="heading" class="mb-0">Search Results</h4>
            <span id="message" class="text-muted"></span>
        </div>

        <div id="bulk" class="mb-3">
            <div class="form-check mb-2">
                <input id="all" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="all">Select All</label>
            </div>

            <div class="d-flex gap-2">
                <button id="save" class="btn btn-success">Save Selected</button>
                <button id="hide" class="btn btn-outline-danger">Not Interested</button>
            </div>
        </div>

        <div id="jobs" class="row g-3"></div>

    </main>

    <script src="{{ request.scope.get('root_path', '') }}/static/app.js"></script>
</body>
</html>
